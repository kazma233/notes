# OPML 是订阅目录。程序会展开其中的 xmlUrl、去重后按 rss_concurrency 抓取。
opml_sources: []
  # - name: Engineering Blogs
  #   url: https://engblogs.s3.amazonaws.com/engblogs.opml

# 用户指定的网站探索入口。URL 可以是首页、栏目页、站内搜索页或 sitemap，
# 不是 RSS 地址。默认只在同一 host 内发现文章；include_patterns 存在时还必须匹配。
site_sources:
  - name: OpenAI News
    url: https://openai.com/news/
    include_patterns:
      - '^https://openai\.com/news/?(?:[?#].*)?$'
      - '^https://openai\.com/index/[^/?#]+/?(?:[?#].*)?$'
    max_discovery_pages: 20
    max_articles: 50
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/
    include_patterns:
      - '^https://techcrunch\.com/category/artificial-intelligence(?:/page/\d+)?/?(?:[?#].*)?$'
      - '^https://techcrunch\.com/\d{4}/\d{2}/\d{2}/[^/?#]+/?(?:[?#].*)?$'
    max_discovery_pages: 20
    max_articles: 50
  - name: 36kr
    url: https://36kr.com/
    max_discovery_pages: 20
    max_articles: 50
  - name: jiemian
    url: https://www.jiemian.com/
    max_discovery_pages: 20
    max_articles: 50
  - name: thepaper
    url: https://www.thepaper.cn//
    max_discovery_pages: 20
    max_articles: 50

# topic 只需给出长期关注方向。采集时会自行推导当日的中英文探索词和子议题。
topics:
  - direction: 'ai news today'
