# 使用 IANA 时区名称。用于解释近 24 小时的时间边界和报告中的时间。
timezone: Asia/Shanghai

# 报告写入的本地目录。支持 ~；目录不存在时创建。
report_dir: ~/DailyBriefs

# RSS、OPML 子源和正文抓取共用的最大并发数。
rss_concurrency: 8

# 单个关注方向最多保留的正文条目数。
max_items_per_topic: 10

# 近一年内有更新且已验证可用的 RSS/Atom 源。
rss_sources:
  - name: Scott Hanselman
    url: http://feeds.feedburner.com/ScottHanselman
  - name: ByteByteGo
    url: https://blog.bytebytego.com/feed
  - name: Python Blog
    url: https://blog.python.org/feeds/posts/default?alt=rss
  - name: Golang Weekly
    url: https://cprss.s3.amazonaws.com/golangweekly.com.xml
  - name: PostgreSQL Weekly
    url: https://cprss.s3.amazonaws.com/postgresweekly.com.xml
  - name: Darmau
    url: https://darmau.co/zh/article/rss.xml
  - name: Ein Verne
    url: https://einverne.github.io/feed.xml
  - name: 阮一峰的网络日志
    url: https://feeds.feedburner.com/ruanyifeng
  - name: Julia Evans
