services:
  sub-store:
    image: xream/sub-store:http-meta
    container_name: sub-store
    network_mode: host
    restart: unless-stopped
    environment:
      # 后端路径前缀（相当于访问密码，防局域网误访问）
      - SUB_STORE_FRONTEND_BACKEND_PATH=/substore-26367a946bae
      - SUB_STORE_BACKEND_MERGE=true
      # 拉取机场订阅时使用的默认 UA（多数机场按 UA 返回格式）
      - SUB_STORE_BACKEND_DEFAULT_FLOW_USER_AGENT=clash.meta
    volumes:
      # 数据持久化：订阅、配置全在这，备份整个目录即可
      - ./data:/opt/app/data